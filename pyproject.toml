[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tacspike-slip"
version = "0.1.0"
description = "TacSpike SNN slip detection utilities"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "h5py>=3.8",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
